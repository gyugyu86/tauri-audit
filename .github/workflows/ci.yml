name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pinned to the exact `engines` floor rather than 22.x, so the declared
        # support range and the tested range are the same claim. 26.x is the
        # development environment.
        node-version: ['22.12.0', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # All test layers run offline: no corpus is fetched at test time, the
      # vendored Tauri schemas are committed, and the analyzer never executes
      # the projects it analyzes.
      - run: npm test

  verify:
    # The publication gates, run by CI rather than trusted to be run locally.
    # Both exist to guard something irreversible, and a gate that only runs when
    # somebody remembers is not a gate — one of these was bypassed for real by a
    # shell mistake that read the wrong exit code before a push.
    runs-on: ubuntu-latest
    steps:
      # Full history: the trace scan reads every commit message, and a shallow
      # clone would silently check only the most recent one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci

      - name: Nothing describes how this repository was authored
        run: npm run verify:traces

      - name: Vendored corpus files are unmodified
        run: npm run verify:corpus
