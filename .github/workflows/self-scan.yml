name: Self-scan

# Runs tauri-audit against the deliberately insecure sample app and publishes the
# SARIF, so the code-scanning rendering can be checked against a known mixture of
# severities and confidences.
#
# The scan target is `tests/fixtures/vulnerable/` — synthetic samples only, never
# the repository root and never `tests/corpus/`. It holds two applications:
# `demo-app` (v2) and `legacy-app` (v1), which between them produce findings at
# every severity and, crucially, two rules that report at BOTH confidences in a
# single scan. Those alerts share one rule descriptor, so the alert list titles
# them identically and separates them only by the badge GitHub bands per alert;
# the `[heuristic]` prefix lives in the result message, which the list does not
# show and the alert page does. Checking that by eye is the point of this run.
#
# Scanning the repository root would also pick up `tests/corpus/`, which holds
# unmodified configuration from real third-party projects. Those produce
# heuristic findings about ordinary design choices — shipping without a CSP is
# the Tauri default — and publishing them here would put other people's project
# names in this repository's Security tab looking like vulnerability claims
# against them. They are regression fixtures, not audit subjects.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Scan the sample app
        run: |
          set +e
          node dist/cli/index.js tests/fixtures/vulnerable --sarif > self-scan.sarif
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"
          # Findings are the point of this workflow, so a non-zero exit is the
          # expected outcome and must not fail the job.
          exit 0
        id: scan

      - name: Show what will be uploaded
        run: |
          echo "exit code: ${{ steps.scan.outputs.exit-code }} (1 is expected — the sample is insecure by design)"
          # Read and parse explicitly. `require()` picks a loader by extension and
          # falls back to the JavaScript one for anything it does not know, so
          # require('./self-scan.sarif') parsed SARIF as source and died on the
          # first colon — failing this step, and with it the job, one step before
          # the upload that is the whole point of the workflow.
          node -e "
            const sarif = JSON.parse(require('node:fs').readFileSync('self-scan.sarif', 'utf8'));
            const run = sarif.runs[0];
            const rules = Object.fromEntries(run.tool.driver.rules.map((r) => [r.id, r]));
            console.log(run.results.length + ' result(s), ' + run.tool.driver.rules.length + ' rule(s)');
            for (const result of run.results) {
              const score = rules[result.ruleId].properties['security-severity'];
              console.log(
                result.ruleId.padEnd(14) +
                ' level=' + String(result.level).padEnd(8) +
                ' security-severity=' + String(score).padEnd(5) +
                ' ' + result.properties.confidence
              );
            }
          "

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: self-scan.sarif
          category: tauri-audit-self-scan
